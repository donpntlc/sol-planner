<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SOL Planner">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOL Planner">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>SOL Planner</title>
  <meta name="theme-color" content="#121212">
  <style>
    html,body{background:#121212;margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
    body{touch-action:manipulation}
    @media (display-mode: standalone){#flutter_host{bottom:auto;height:100vh;height:100lvh}}
    #flutter_host{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="flutter_host"></div>
  <script>
    // iPhone: Seite darf nie verrutschen (sonst stimmen Tipp-Position und Anzeige nicht überein).
    (function () {
      function reset() {
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        var se = document.scrollingElement;
        if (se && (se.scrollTop || se.scrollLeft)) { se.scrollTop = 0; se.scrollLeft = 0; }
      }
      window.addEventListener('scroll', reset, { passive: true });
      document.addEventListener('focusout', function () { setTimeout(reset, 50); setTimeout(reset, 400); });
      window.addEventListener('resize', function () { setTimeout(reset, 50); });
      window.addEventListener('pageshow', reset);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { setTimeout(reset, 50); });
      }
    })();
  </script>
  <script>
    // Datei wählen (z. B. PREPIT-Makroplan) und Text zurückgeben.
    window.solPickJsonFile = function () {
      return new Promise(function (resolve) {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json,application/json,text/plain';
        inp.style.display = 'none';
        inp.onchange = function () {
          var f = inp.files && inp.files[0];
          inp.remove();
          if (!f) { resolve(null); return; }
          f.text().then(resolve, function () { resolve(null); });
        };
        document.body.appendChild(inp);
        inp.click();
      });
    };
  </script>
  <script>
    // Kalenderdatei (.ics) speichern bzw. teilen → iPhone fragt „Zum Kalender hinzufügen“.
    window.solSaveIcs = function (name, text, share) {
      var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
      if (share && navigator.canShare) {
        try {
          var f = new File([blob], name, { type: 'text/calendar' });
          if (navigator.canShare({ files: [f] })) {
            navigator.share({ files: [f], title: name }).catch(function () {});
            return 'shared';
          }
        } catch (e) {}
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      return 'download';
    };
  </script>
  <script>
    // Ränder des iPhones (Statusleiste, Home-Leiste) messen und an die App geben.
    (function () {
      var p = document.createElement('div');
      p.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
        'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
      document.documentElement.appendChild(p);
      function upd() {
        var c = getComputedStyle(p);
        window.solSafeTop = parseFloat(c.paddingTop) || 0;
        window.solSafeRight = parseFloat(c.paddingRight) || 0;
        window.solSafeBottom = parseFloat(c.paddingBottom) || 0;
        window.solSafeLeft = parseFloat(c.paddingLeft) || 0;
      }
      upd();
      window.addEventListener('resize', upd);
      window.addEventListener('orientationchange', function () { setTimeout(upd, 300); });
    })();
  </script>
  <script>
    // Lädt immer die neueste Version: latest.json wird nie aus dem Cache genommen,
    // jede Version liegt in einem eigenen Ordner (b/<version>/).
    (function () {
      function start(base) {
        var b = document.createElement('base');
        b.href = base;
        document.head.appendChild(b);
        var s = document.createElement('script');
        s.src = base + 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          try { localStorage.setItem('sol_latest_base', j.base); } catch (e) {}
          start(j.base);
        })
        .catch(function () {
          var last = null;
          try { last = localStorage.getItem('sol_latest_base'); } catch (e) {}
          if (last) start(last);
        });
    })();
  </script>
</body>
</html>
