<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/sol-planner/b/20261029223246-fd2d651/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SOL Planner">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOL Planner">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SOL Planner</title>
  <meta name="theme-color" content="#121212">
  <style>
    html,body{background:#121212;margin:0;height:100%;overflow:hidden}
    #flutter_host{position:fixed;inset:0}
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="flutter_host"></div>
  <script>
    // Ränder des iPhones (Statusleiste, Home-Leiste) messen und an die App geben.
    (function () {
      var p = document.createElement('div');
      p.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
        'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
      document.documentElement.appendChild(p);
      function upd() {
        var c = getComputedStyle(p);
        window.solSafeTop = parseFloat(c.paddingTop) || 0;
        window.solSafeRight = parseFloat(c.paddingRight) || 0;
        window.solSafeBottom = parseFloat(c.paddingBottom) || 0;
        window.solSafeLeft = parseFloat(c.paddingLeft) || 0;
      }
      upd();
      window.addEventListener('resize', upd);
      window.addEventListener('orientationchange', function () { setTimeout(upd, 300); });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
